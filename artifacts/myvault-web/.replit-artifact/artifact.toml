kind = "web"
previewPath = "/"
title = "MyVault Web"
version = "1.0.0"
id = "artifacts/myvault-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18899

[services.development]
run = "pnpm --filter @workspace/myvault-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/myvault-web", "run", "build" ]
publicDir = "artifacts/myvault-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18899"
BASE_PATH = "/"
