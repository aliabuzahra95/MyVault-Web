<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MyVault disposable Drive check</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { max-width: 38rem; margin: 3rem auto; padding: 0 1.25rem; color: #20242b; background: #f8f9fb; line-height: 1.55; }
      h1 { font-size: 1.55rem; line-height: 1.2; }
      button { min-height: 2.75rem; margin: .5rem .5rem .5rem 0; padding: .55rem 1rem; border: 1px solid #2158b5; border-radius: 6px; background: #2158b5; color: #fff; font: inherit; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      #copy { background: transparent; color: #2158b5; }
      #status { padding: 1rem 0; font-weight: 600; }
      #detail { white-space: pre-wrap; overflow-wrap: anywhere; }
      .muted { color: #58616c; }
    </style>
  </head>
  <body>
    <h1>Disposable Drive visibility check</h1>
    <p>This checks one test file created by MyVault on Android, then creates one test file in the same disposable folder. It does not open your Vault or your backups.</p>
    <button id="run" type="button">Check test files</button>
    <button id="copy" type="button" hidden>Copy result</button>
    <p id="status" role="status" aria-live="polite">Ready. Use this page in your normal Google Chrome window.</p>
    <p id="detail" class="muted"></p>
    <script>
      (() => {
        const proof = Object.freeze({
          accountId: "14287589311515837545",
          rootId: "1aLk2-9E1SOLPYvLuOhG-Hu-Zo9dQ4Mku",
          rootName: "MYVAULT-OAUTH-VISIBILITY-DISPOSABLE-a0cc73a0-6dc1-4878-83ad-baa7b699a0c1",
          androidFileId: "1TJcmWNIm7fSsWOT79hStp4JWFc2pe1Ga",
          androidSha256: "313e2d87808a4aaeff71d19c010ac7689411750c7a316648716ba0875cb44199",
        });
        const driveBase = "https://www.googleapis.com/drive/v3";
        const webName = "web-proof.txt";
        const webBytes = new TextEncoder().encode("Disposable Web visibility proof: English العربية");
        const storageKey = `myvault-disposable-web-proof-${proof.rootId}`;
        const runButton = document.querySelector("#run");
        const copyButton = document.querySelector("#copy");
        const status = document.querySelector("#status");
        const detail = document.querySelector("#detail");
        let result = null;

        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        const digest = async (bytes) => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)))
          .map((value) => value.toString(16).padStart(2, "0")).join("");
        const drive = async (token, path, options = {}) => fetch(`${driveBase}${path}`, {
          ...options,
          headers: { Authorization: `Bearer ${token}`, ...(options.headers || {}) },
        });
        const required = async (response, context) => {
          assert(response.ok, `${context} failed (HTTP ${response.status}). No backup files were touched.`);
          return response;
        };
        const metadata = async (token, id, fields) => {
          const path = `/files/${encodeURIComponent(id)}?fields=${encodeURIComponent(fields)}`;
          return (await required(await drive(token, path), "Test file lookup")).json();
        };
        const content = async (token, id) => new Uint8Array(await (
          await required(await drive(token, `/files/${encodeURIComponent(id)}?alt=media`), "Test file read")
        ).arrayBuffer());

        async function children(token) {
          const found = [];
          let pageToken;
          do {
            const params = new URLSearchParams({
              q: `'${proof.rootId}' in parents and trashed = false`,
              fields: "nextPageToken,files(id,name,parents,trashed)",
              pageSize: "1000",
            });
            if (pageToken) params.set("pageToken", pageToken);
            const page = await (await required(await drive(token, `/files?${params}`), "Test folder listing")).json();
            assert(Array.isArray(page.files), "Test folder listing was incomplete.");
            found.push(...page.files);
            pageToken = page.nextPageToken;
          } while (pageToken);
          return found;
        }

        async function verifyWebFile(token, id, expectedHash) {
          const file = await metadata(token, id, "id,name,parents,trashed,size");
          assert(file.id === id && file.name === webName && file.trashed !== true
            && Array.isArray(file.parents) && file.parents.includes(proof.rootId),
          "Existing test file identity or folder did not match. Nothing was changed.");
          const bytes = await content(token, id);
          assert(bytes.length === webBytes.length && file.size === String(webBytes.length)
            && await digest(bytes) === expectedHash,
          "Existing test file bytes did not match. Nothing was changed.");
        }

        async function createOrRecoverWebFile(token, listed) {
          const expectedHash = await digest(webBytes);
          const matching = listed.filter((file) => file.name === webName);
          assert(matching.length <= 1, "More than one Web test file exists. Stopped without creating another.");
          let id = sessionStorage.getItem(storageKey) || matching[0]?.id;
          if (id) {
            const check = await drive(token, `/files/${encodeURIComponent(id)}?fields=id`);
            if (check.status !== 404) {
              await required(check, "Existing Web test file lookup");
              await verifyWebFile(token, id, expectedHash);
              return { id, hash: expectedHash, reused: true };
            }
            assert(!matching.length, "A listed Web test file could not be read. Stopped safely.");
          } else {
            const generated = await (await required(
              await drive(token, "/files/generateIds?count=1&space=drive&type=files"), "Test file ID reservation"
            )).json();
            id = generated.ids?.[0];
            assert(typeof id === "string" && /^[A-Za-z0-9_-]+$/.test(id), "Google did not reserve a valid test file ID.");
            sessionStorage.setItem(storageKey, id);
          }

          const boundary = `myvault-disposable-${crypto.randomUUID()}`;
          const body = new Blob([
            `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ id, name: webName, parents: [proof.rootId] })}\r\n`,
            `--${boundary}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n`,
            webBytes,
            `\r\n--${boundary}--\r\n`,
          ]);
          const created = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": `multipart/related; boundary=${boundary}` },
            body,
          });
          if (!created.ok) {
            throw new Error(`Test file creation was uncertain (HTTP ${created.status}). Retry this page; it will check the reserved ID first.`);
          }
          assert((await created.json()).id === id, "Google returned a different test file ID. Stopped safely.");
          await verifyWebFile(token, id, expectedHash);
          return { id, hash: expectedHash, reused: false };
        }

        async function run() {
          runButton.disabled = true;
          copyButton.hidden = true;
          status.textContent = "Checking the disposable test folder...";
          detail.textContent = "";
          try {
            const sessionResponse = await fetch("/api/google-drive-auth", {
              credentials: "same-origin", headers: { Accept: "application/json" },
            });
            assert(sessionResponse.ok,
              sessionResponse.status === 401
                ? "MyVault Web is not connected to Google Drive in this Chrome session. Open MyVault Web, connect Drive there, then return and retry."
                : `MyVault Web could not open its Drive connection (HTTP ${sessionResponse.status}).`);
            const session = await sessionResponse.json();
            assert(typeof session.accessToken === "string" && session.accessToken.length > 0,
              "MyVault Web did not return a usable Drive connection.");
            assert(session.scope?.split(/\s+/).includes("https://www.googleapis.com/auth/drive.file"),
              "The existing Drive permission was not granted. No broader permission was requested.");
            assert(session.accountId === proof.accountId,
              "This is a different Google Drive account from the Samsung test account. Nothing was changed.");
            const token = session.accessToken;
            const about = await (await required(await drive(token, "/about?fields=user(permissionId)"), "Drive account check")).json();
            assert(about.user?.permissionId === proof.accountId, "Google Drive account identity did not match. Nothing was changed.");
            const root = await metadata(token, proof.rootId, "id,name,mimeType,trashed");
            assert(root.id === proof.rootId && root.name === proof.rootName
              && root.mimeType === "application/vnd.google-apps.folder" && root.trashed !== true,
            "The disposable Android test folder was not visible to this Web connection. Nothing was changed.");
            const listed = await children(token);
            const android = listed.find((file) => file.id === proof.androidFileId);
            assert(android && android.parents?.includes(proof.rootId),
              "The Samsung-created test file was not visible in the Web folder listing. Nothing was changed.");
            const androidBytes = await content(token, proof.androidFileId);
            assert(await digest(androidBytes) === proof.androidSha256,
              "The Samsung-created test file did not match its verified hash. Nothing was changed.");
            const web = await createOrRecoverWebFile(token, listed);
            result = {
              status: "WEB_VERIFIED", accountId: proof.accountId, rootId: proof.rootId,
              androidFileId: proof.androidFileId, androidSha256: proof.androidSha256,
              webFileId: web.id, webSha256: web.hash, reusedWebFile: web.reused,
            };
            status.textContent = "Success: Web read the Samsung test file and verified its own test file.";
            detail.textContent = "Copy the result and send it to Codex. The Samsung read-back check is still needed.";
            copyButton.hidden = false;
          } catch (error) {
            result = { status: "FAILED", message: error instanceof Error ? error.message : "Test check failed." };
            status.textContent = "The check stopped safely.";
            detail.textContent = result.message;
          } finally {
            runButton.disabled = false;
          }
        }
        runButton.addEventListener("click", run);
        copyButton.addEventListener("click", async () => {
          if (result?.status !== "WEB_VERIFIED") return;
          await navigator.clipboard.writeText(JSON.stringify(result));
          detail.textContent = "Result copied. Send it to Codex.";
        });
      })();
    </script>
  </body>
</html>
